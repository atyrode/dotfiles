name: Check agent instructions
description: Check generated policy bytes and actual OMP loading of the candidate instructions.
inputs:
  layout:
    description: Fixed target layout (repository or dotfiles).
    required: false
    default: repository
runs:
  using: composite
  steps:
    - name: Check shared policy bytes
      shell: bash
      env:
        POLICY_LAYOUT: ${{ inputs.layout }}
        POLICY_ACTION_REF: ${{ github.action_ref }}
      run: |
        source_root="$(realpath -- "$GITHUB_ACTION_PATH/../../..")"
        source_file="$source_root/modules/home/agents/engineering.md"
        digest="$(sha256sum -- "$source_file")"
        {
          printf '## Shared engineering contract\n\n'
          printf 'Source: https://github.com/atyrode/dotfiles/blob/main/modules/home/agents/engineering.md\n\n'
          printf 'Bundled payload SHA256: `%s`\n\n' "${digest%% *}"
          printf 'Action ref: `%s` (not a resolved commit SHA).\n\n' "${POLICY_ACTION_REF:-local candidate}"
          printf 'This check uses the source bundled with its action snapshot, not a later resolution of main.\n'
        } >> "$GITHUB_STEP_SUMMARY"
        python3 "$source_root/ci/agent-policy.py" check \
          --source "$source_file" \
          --root "$GITHUB_WORKSPACE" \
          --layout "$POLICY_LAYOUT"

    - name: Install Nix for the pinned OMP runtime
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

    - name: Check actual OMP context loading
      shell: bash
      run: |
        source_root="$(realpath -- "$GITHUB_ACTION_PATH/../../..")"
        # Build the runtime from this action's reviewed snapshot, not a second pin
        # or a later resolution of main. The consumer's code is never executed.
        omp_package="$(nix build --no-link --print-out-paths "path:$source_root#omp")"
        python3 "$source_root/ci/check-agent-context.py" \
          --omp "$omp_package/bin/omp" \
          --repository "$GITHUB_WORKSPACE" \
          --personal-context "$source_root/modules/home/agents/AGENTS.md" \
          --common-policy "$source_root/modules/home/agents/engineering.md"
