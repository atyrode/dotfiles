name: Agent policy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-policy:
    name: agent-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Check candidate policy
        uses: ./.github/actions/agent-policy
        with:
          layout: dotfiles

      - name: Exercise renderer and synchronizer contracts
        run: |
          python3 checks/lints/agent-policy-test.py
          python3 checks/lints/agent-policy-sync-test.py
