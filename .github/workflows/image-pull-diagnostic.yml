name: Image pull diagnostic
on:
  pull_request:
    paths: [.github/workflows/image-pull-diagnostic.yml]
permissions:
  contents: read
jobs:
  anonymous:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pull public image with empty credentials
        run: |
          config=$(mktemp -d /dev/shm/image-pull.XXXXXX)
          trap 'rm -rf "$config"' EXIT
          export DOCKER_CONFIG="$config"
          df -h
          docker info
          docker pull --platform linux/arm64 ghcr.io/atyrode/development@sha256:f41ca1ba59430fbd7adbcc02bb33ef87f69de3af42edd4cd3371e1ade6e26ea3
          docker pull --platform linux/amd64 ghcr.io/atyrode/development@sha256:f41ca1ba59430fbd7adbcc02bb33ef87f69de3af42edd4cd3371e1ade6e26ea3
