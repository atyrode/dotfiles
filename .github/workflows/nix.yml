name: Nix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # The classify job lists pull-request files.
  pull-requests: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation paths are guarded before the full matrix is skipped. For
  # code changes, only an explicit Linux-only allowlist can skip native Darwin;
  # shared, Darwin-specific, workflow, and unknown paths fail safe to Darwin.
  changes:
    name: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      darwin: ${{ steps.classify.outputs.darwin }}
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Pushes to main and manual runs retain the complete native matrix.
          code=true
          darwin=true
          if [ -n "$PR_NUMBER" ]; then
            if files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" \
              --paginate --jq '.[].filename')" && [ -n "$files" ]; then
              classification="$(printf '%s\n' "$files" | ./ci/classify-ci-paths.sh)"
              code="$(printf '%s\n' "$classification" | sed -n 's/^code=//p')"
              darwin="$(printf '%s\n' "$classification" | sed -n 's/^darwin=//p')"
            fi
          fi
          # The system set is centralized in ci/ci.json; keep this
          # static matrix in sync with it.
          if "$darwin"; then
            matrix='{"include":[{"system":"x86_64-linux","runner":"ubuntu-24.04"},{"system":"aarch64-linux","runner":"ubuntu-24.04-arm"},{"system":"aarch64-darwin","runner":"macos-15"}]}'
          else
            matrix='{"include":[{"system":"x86_64-linux","runner":"ubuntu-24.04"},{"system":"aarch64-linux","runner":"ubuntu-24.04-arm"}]}'
          fi
          printf 'code=%s\ndarwin=%s\nmatrix=%s\n' "$code" "$darwin" "$matrix" >> "$GITHUB_OUTPUT"
          echo "classified: code=$code darwin=$darwin"

  check:
    name: ${{ matrix.system }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            substituters = https://cache.nixos.org

      # --print-build-logs: without it a failing check prints "run nix log" for
      # a store path on a runner that no longer exists, so the one job that can
      # reproduce a platform-specific failure reports it undiagnosably.
      - name: Check flake
        run: nix flake check --show-trace --print-build-logs

  # Build every host closure for each platform, rebuilding repository-specific
  # paths locally when the official cache does not provide them.
  closures:
    name: closures ${{ matrix.system }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            substituters = https://cache.nixos.org

      # No dry run in front of the build: the build prints the same list of
      # derivations it will compile before it starts them, and a dry run is a
      # second full evaluation of this flake, which on the Mac is two minutes.
      # A package that turns up in that list is a source build on every fresh
      # machine too: Signal Desktop on aarch64-darwin was a multi-hour Electron
      # compile that looked like a hung job, which is what the timeout below
      # names.

      # Keep the existing build bound: an unexpectedly expensive upstream
      # source build must still fail visibly.
      - name: Build fleet closures
        timeout-minutes: 20
        run: nix build .#fleet-closures --print-build-logs --min-free 2G --max-free 6G

  development-image:
    name: development image ${{ matrix.system }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            architecture: amd64
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            substituters = https://cache.nixos.org

      - name: Build standalone development environment
        run: nix build .#development-image --print-build-logs

      - name: Load and verify standalone environment
        id: verify
        run: |
          image_name="$(nix eval --raw .#development-image.imageName)"
          image_tag="$(nix eval --raw .#development-image.imageTag)"
          docker load --input result
          printf 'Compressed development image archive: %s bytes\n' "$(stat -Lc %s result)" >> "$GITHUB_STEP_SUMMARY"
          nix shell --inputs-from . nixpkgs#tmux nixpkgs#python3 \
            --command python3 ci/verify-development-image.py "$image_name:$image_tag"

      - name: Retain terminal verification captures
        if: always() && steps.verify.outputs.captures != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-captures-${{ matrix.architecture }}
          path: ${{ steps.verify.outputs.captures }}
          retention-days: 1

      - name: Stage tested archive
        if: github.ref == 'refs/heads/main'
        run: cp --dereference result development-image.tar.gz

      - name: Retain tested main archive
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-image-${{ matrix.architecture }}
          path: development-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Docs-only fast path: Markdown is not fully inert — links are linted and
  # docs can leak production facts — so build the two intentional whole-tree
  # lints when the matrix is skipped, then guard the fast-path invariant
  # itself: instantiate every check on every platform at base and head
  # (evaluation-only, no builds) and fail if the docs change altered any
  # other derivation. No store cache: the lints only need python3 from the
  # binary cache, and the guard never builds.
  docs-links:
    name: docs-links
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check documentation links and production facts
        run: nix build .#checks.x86_64-linux.docs-links .#checks.x86_64-linux.production-facts .#checks.x86_64-linux.secret-shapes --show-trace

      # The checkout is the pull request merged onto the current base branch,
      # so the base to compare against is that merge's first parent, not the
      # event's base.sha, which is the base as of the last push and goes
      # stale the moment anything else lands. Comparing against the stale
      # base attributed other pull requests' changes to a docs-only one.
      - name: Guard the fast-path dependency invariant
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$EVENT_BASE_SHA"
          fi
          git fetch --quiet --depth=1 origin "$base"
          ./ci/docs-drift-guard.sh "$base" "$(git rev-parse HEAD)"

  # Sole required status check (#169): the protect-main ruleset requires the
  # `ci-gate` context (flipped from the three platform names on 2026-07-15).
  # Always reports, so a path-skipped matrix can never leave a pull request
  # stuck on a missing check. Passes only when classification succeeded,
  # nothing failed or was cancelled, and at least one real verification
  # (matrix or docs-links) ran.
  ci-gate:
    name: ci-gate
    needs: [changes, check, closures, development-image, docs-links]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e '
            (.changes.result == "success")
            and ([.[] | .result] | all(. == "success" or . == "skipped"))
            and (
              (.changes.outputs.code == "true"
                and .check.result == "success"
                and .closures.result == "success"
                and .["development-image"].result == "success")
              or (.changes.outputs.code == "false" and .["docs-links"].result == "success")
            )
          ' <<<"$NEEDS" >/dev/null

  publish-development-image:
    name: publish development image
    needs: [ci-gate, development-image]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success' && needs.development-image.result == 'success' }}
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download this run's tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run download "$RUN_ID" --repo "$REPOSITORY" --pattern development-image-amd64 --dir tested-archives
          gh run download "$RUN_ID" --repo "$REPOSITORY" --pattern development-image-arm64 --dir tested-archives

      - name: Publish immutable revisions and verify anonymous access
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | python3 ci/publish-development-image.py \
            tested-archives "$REVISION" --username "$GITHUB_ACTOR" \
            --output development-image-reference.txt

      - name: Retain published digest reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-image-reference
          path: development-image-reference.txt
          if-no-files-found: error
