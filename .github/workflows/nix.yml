name: Nix

on:
  pull_request:
  # Pull requests merge through GitHub's merge queue, which tests the merged
  # result on a temporary branch before touching main. That branch fires this
  # event and needs the same gate; without it the queue waits on a check that
  # never reports. A merge-group run has no pull-request number, so classify
  # keeps its full native matrix, which is exactly what a merge should get.
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # The classify job lists pull-request files.
  pull-requests: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation paths are guarded before the full matrix is skipped. For
  # code changes, only an explicit Linux-only allowlist can skip native Darwin;
  # shared, Darwin-specific, workflow, and unknown paths fail safe to Darwin.
  changes:
    name: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      darwin: ${{ steps.classify.outputs.darwin }}
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Pushes to main and manual runs retain the complete native matrix.
          code=true
          darwin=true
          if [ -n "$PR_NUMBER" ]; then
            if files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" \
              --paginate --jq '.[].filename')" && [ -n "$files" ]; then
              classification="$(printf '%s\n' "$files" | ./scripts/classify-ci-paths.sh)"
              code="$(printf '%s\n' "$classification" | sed -n 's/^code=//p')"
              darwin="$(printf '%s\n' "$classification" | sed -n 's/^darwin=//p')"
            fi
          fi
          # The system set is centralized in inventory/ci.json; keep this
          # static matrix in sync with it.
          if "$darwin"; then
            matrix='{"include":[{"system":"x86_64-linux","runner":"ubuntu-24.04"},{"system":"aarch64-linux","runner":"ubuntu-24.04-arm"},{"system":"aarch64-darwin","runner":"macos-15"}]}'
          else
            matrix='{"include":[{"system":"x86_64-linux","runner":"ubuntu-24.04"},{"system":"aarch64-linux","runner":"ubuntu-24.04-arm"}]}'
          fi
          printf 'code=%s\ndarwin=%s\nmatrix=%s\n' "$code" "$darwin" "$matrix" >> "$GITHUB_OUTPUT"
          echo "classified: code=$code darwin=$darwin"

  check:
    name: ${{ matrix.system }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      # cache-nix-action purges superseded platform caches after saving.
      actions: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Restore the newest Nix store cache for this platform; without it every
      # run rebuilds all local derivations from an empty store (~13 min).
      # Every run saves on a primary-key miss, so a pull request that changes
      # flake.lock pays the cold rebuild once instead of on every push; the
      # purge inputs then keep only the newest cache per platform inside
      # GitHub's 10 GiB quota. The store is deliberately not garbage-collected
      # before saving: a `nix flake check` store has no GC roots, so
      # collection would empty it.
      - name: Restore Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', '**/*.nix', 'checks/**', 'darwin/**', 'home/**', 'hosts/**', 'inventory/**', 'modules/**', 'pkgs/**', 'scripts/**', 'install.sh') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          purge: true
          purge-prefixes: nix-${{ matrix.system }}-
          purge-created: 0
          purge-primary-key: never

      # --print-build-logs: without it a failing check prints "run nix log" for
      # a store path on a runner that no longer exists, so the one job that can
      # reproduce a platform-specific failure reports it undiagnosably.
      - name: Check flake
        run: nix flake check --show-trace --print-build-logs

  # Every host closure this system can realise, built as the fleet's only
  # builder and, on Linux, published for the fleet to download instead of
  # rebuild. Deliberately a separate job with no store cache: the closures are
  # several gigabytes each, and saving a store that holds them would blow the
  # repository's 10 GiB Actions cache quota and evict the check caches every
  # run. With nothing to restore, the job substitutes from cache.nixos.org and
  # from the fleet cache itself, so once a revision's own derivations have been
  # pushed the next run is almost entirely downloads.
  #
  # Darwin is built and never pushed. There is one Mac, so a cached Darwin
  # closure would have exactly one consumer -- the machine that would build it
  # anyway. Building it here is the gate that was missing: the class of failure
  # that once reached the Mac only surfaces inside this derivation.
  closures:
    name: closures ${{ matrix.system }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Forks and pull-request branches have no repository secrets, so they
      # build every closure and simply never push. Evaluated at the job level
      # because secrets cannot be read from a step's `if` directly.
      HAVE_CACHE: ${{ secrets.CELLAR_ADDON_KEY_ID != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # The standard macOS runner offers about 14 GB for a closure that is
      # already 10 GiB. Most of its disk is taken by toolchains this job never
      # touches: several Xcode versions, the Android SDK, .NET, simulator
      # runtimes. Removing them is what people do instead of paying for a
      # larger runner; the sizes are printed so the log shows the margin.
      - name: Free runner disk
        if: runner.os == 'macOS'
        run: |
          df -h / | tail -1
          keep="$(xcode-select -p | sed 's|/Contents/Developer||')"
          for xcode in /Applications/Xcode_*.app; do
            [ "$xcode" = "$keep" ] || sudo rm -rf "$xcode"
          done
          sudo rm -rf /Library/Android /usr/local/share/dotnet /usr/local/.ghcup \
            ~/Library/Developer/CoreSimulator/Caches ~/.dotnet 2>/dev/null || true
          df -h / | tail -1

      # Nix >= 2.33 is required for the push: the S3 store moved from the AWS
      # SDK to native curl SigV4, which is what makes Cellar (Ceph RGW,
      # path-style, no checksum negotiation) a reliable target. The action's
      # default only moves forward; do not pass an older nix_version. The
      # fleet cache is a substituter here too, so a revision whose own
      # derivations are already published is not rebuilt.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://atyrode-nix-cache.cellar-c2.services.clever-cloud.com
            extra-trusted-public-keys = atyrode-cache-1:ZTyrQ0+itTPQ2/74z2AoDzwwsoAS9uZ62lWMA8UlQy0=

      # The dry run is the diagnostic. It lists every derivation this system
      # would compile rather than download, so when the build below runs out
      # of its budget the culprit is already named in the step above it. A
      # package that shows up here is a source build on every fresh machine
      # too: Signal Desktop on aarch64-darwin was a multi-hour Electron compile
      # that looked like a hung job, because the one Mac had paid it once and
      # nobody else ever had.
      - name: Preview fleet closure work
        run: nix build .#fleet-closures --dry-run

      # Twenty minutes is generous for downloading a closure and building the
      # handful of derivations that are ours; anything longer is compiling a
      # package that belongs in a cache or a vendor release, and the job fails
      # with that name in the log instead of timing out in silence.
      - name: Build fleet closures
        timeout-minutes: 20
        run: nix build .#fleet-closures --print-build-logs --min-free 2G --max-free 6G

      # Only green main is published: machines converge to what CI built from
      # main and nothing else. The signing key exists on disk for the length
      # of this step, mode 600 under the runner's private temp directory, and
      # is removed on every exit path. zstd with parallel compression keeps a
      # multi-gigabyte first push inside the job timeout; xz would take an hour.
      - name: Push fleet closures to the cache
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && env.HAVE_CACHE == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CELLAR_ADDON_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CELLAR_ADDON_KEY_SECRET }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/nix-cache-signing-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$key")
          nix copy \
            --to "s3://atyrode-nix-cache?endpoint=cellar-c2.services.clever-cloud.com&region=us-east-1&scheme=https&compression=zstd&parallel-compression=true&secret-key=$key" \
            ./result

  # Docs-only fast path: Markdown is not fully inert — links are linted and
  # docs can leak production facts — so build the two intentional whole-tree
  # lints when the matrix is skipped, then guard the fast-path invariant
  # itself: instantiate every check on every platform at base and head
  # (evaluation-only, no builds) and fail if the docs change altered any
  # other derivation. No store cache: the lints only need python3 from the
  # binary cache, and the guard never builds.
  docs-links:
    name: docs-links
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check documentation links and production facts
        run: nix build .#checks.x86_64-linux.docs-links .#checks.x86_64-linux.production-facts --show-trace

      - name: Guard the fast-path dependency invariant
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          ./scripts/docs-drift-guard.sh "$BASE_SHA" "$(git rev-parse HEAD)"

  # Sole required status check (#169): the protect-main ruleset requires the
  # `ci-gate` context (flipped from the three platform names on 2026-07-15).
  # Always reports, so a path-skipped matrix can never leave a pull request
  # stuck on a missing check. Passes only when classification succeeded,
  # nothing failed or was cancelled, and at least one real verification
  # (matrix or docs-links) ran.
  ci-gate:
    name: ci-gate
    needs: [changes, check, closures, docs-links]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e '
            (.changes.result == "success")
            and ([.[] | .result] | all(. == "success" or . == "skipped"))
            and ((.check.result == "success" and .closures.result == "success") or (.["docs-links"].result == "success"))
          ' <<<"$NEEDS" >/dev/null
