name: Update pins

# Dependency-update policy (#13):
# - Narrow, repository-owned binary pins are validated by their approved
#   pull-request CI and retain this workflow's existing auto-merge behavior.
# - Environment-wide flake.lock updates are opened for operator review by
#   flake-update.yml and are never auto-merged, as required by #13.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-pins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Refresh pins
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          summary="$(./ci/update-pins.sh)"
          {
            printf 'summary<<SUMMARY_EOF\n%s\nSUMMARY_EOF\n' "$summary"
            if [ -n "$summary" ]; then printf 'changed=true\n'; fi
          } >> "$GITHUB_OUTPUT"

      # Bot-created pushes do not trigger workflows on their own, so the
      # pull-request runs that carry the required `ci-gate` and `agent-policy`
      # contexts are parked in `action_required` and must be approved before
      # the merge can proceed.
      - name: Open and land the bump
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
        run: |
          branch="bot/update-pins"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add pkgs
          git commit -m "chore(pins): refresh repository-owned binaries" -m "$SUMMARY"
          # Configure Git's ephemeral credential helper from this step's
          # GH_TOKEN; checkout never persists a token in .git/config.
          gh auth setup-git --hostname github.com
          git push -f origin "$branch"
          # An existing open PR for the branch makes `gh pr create` fail on
          # re-runs; anything else must fail the job here instead of surfacing
          # later as a confusing `gh pr merge` error with no PR open. A re-run
          # rewrites the bump, so it also replaces the body to describe it.
          if ! gh pr create --base main --head "$branch" \
            --title "chore(pins): refresh repository-owned binaries" \
            --body "$SUMMARY"; then
            gh pr view "$branch" --json url --jq .url
            gh pr edit "$branch" --body "$SUMMARY"
          fi
          # Branch protection requires `ci-gate` (nix.yml) and `agent-policy`
          # (agent-policy.yml), and only each workflow's pull_request-event
          # run reports its context. Dispatching a parallel workflow_dispatch
          # run instead left the gate unreported, so auto-merge waited
          # forever: #431 sat green but unmerged for two days. Approving only
          # nix.yml did the same with `agent-policy`: #630 waited three weeks.
          # Approve each parked run — the same verification a human pull
          # request gets, and the verdicts branch protection actually reads.
          # A red run leaves the pull request open: bundled content changes
          # usually need patch or fixture curation before the bump can land.
          head_sha="$(git rev-parse HEAD)"
          parked() { [ "$(gh run view "$1" --json conclusion --jq '.conclusion // ""')" = action_required ]; }
          run_ids=()
          for workflow in nix.yml agent-policy.yml; do
            run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list --workflow "$workflow" --commit "$head_sha" \
                --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [ -n "$run_id" ]; then break; fi
              sleep 10
            done
            if [ -z "$run_id" ]; then
              echo "no $workflow pull_request run appeared for $head_sha; its required context cannot report" >&2
              exit 1
            fi
            if parked "$run_id"; then
              gh api --silent -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
              # Approval resumes the same run; wait for it to leave the parked
              # state so `gh run watch` reads the real verdict, not the stub.
              for _ in $(seq 1 30); do
                if ! parked "$run_id"; then break; fi
                sleep 10
              done
            fi
            run_ids+=("$run_id")
          done
          for run_id in "${run_ids[@]}"; do
            gh run watch "$run_id" --exit-status
          done
          gh pr merge "$branch" --squash --delete-branch --auto
          gh workflow run nix.yml --ref main
