name: Update pins

# Dependency-update policy (#13):
# - Narrow, repository-owned binary pins are validated by their approved
#   pull-request CI and retain this workflow's existing auto-merge behavior.
# - Environment-wide flake.lock updates are opened for operator review by
#   flake-update.yml and are never auto-merged, as required by #13.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-pins
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Refresh pins
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          summary="$(./ci/update-pins.sh)"
          {
            printf 'summary<<SUMMARY_EOF\n%s\nSUMMARY_EOF\n' "$summary"
            if [ -n "$summary" ]; then printf 'changed=true\n'; fi
          } >> "$GITHUB_OUTPUT"

      # Bot-created pushes do not trigger workflows on their own, so the
      # pull-request runs that carry the required `ci-gate` and `agent-policy`
      # contexts are parked in `action_required` and must be approved before
      # the merge can proceed.
      - name: Open and land the bump
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
        run: |
          branch="bot/update-pins"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Configure Git's ephemeral credential helper from this step's
          # GH_TOKEN; checkout never persists a token in .git/config.
          gh auth setup-git --hostname github.com
          # A red bump stays open for curation commits (patches, fixtures,
          # launcher grammar). Force-pushing a fresh commit on every refresh
          # erased them, so keep an open PR's head while its pinned files
          # already match this refresh, and only check and land it below.
          mapfile -t pinned < <(git diff --name-only -- pkgs)
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" = OPEN ] &&
            git fetch --quiet --depth=1 origin "$branch" &&
            git diff --quiet FETCH_HEAD -- "${pinned[@]}"; then
            head_sha="$(git rev-parse FETCH_HEAD)"
          else
            git checkout -B "$branch"
            git add pkgs
            git commit -m "chore(pins): refresh repository-owned binaries" -m "$SUMMARY"
            git push -f origin "$branch"
            # An existing open PR for the branch makes `gh pr create` fail on
            # re-runs; anything else must fail the job here instead of
            # surfacing later as a confusing `gh pr merge` error with no PR
            # open. A re-run rewrites the bump, so it also replaces the body.
            if ! gh pr create --base main --head "$branch" \
              --title "chore(pins): refresh repository-owned binaries" \
              --body "$SUMMARY"; then
              gh pr view "$branch" --json url --jq .url
              gh pr edit "$branch" --body "$SUMMARY"
            fi
            head_sha="$(git rev-parse HEAD)"
          fi
          # Branch protection requires `ci-gate` (nix.yml) and `agent-policy`
          # (agent-policy.yml), and only each workflow's pull_request-event
          # run reports its context. Dispatching a parallel workflow_dispatch
          # run instead left the gate unreported, so auto-merge waited
          # forever: #431 sat green but unmerged for two days. Approving only
          # nix.yml did the same with `agent-policy`: #630 waited three weeks.
          # Approve each parked run — the same verification a human pull
          # request gets, and the verdicts branch protection actually reads.
          # A red run leaves the pull request open: bundled content changes
          # usually need patch or fixture curation before the bump can land.
          parked() { [ "$(gh run view "$1" --json conclusion --jq '.conclusion // ""')" = action_required ]; }
          run_ids=()
          for workflow in nix.yml agent-policy.yml; do
            run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list --workflow "$workflow" --commit "$head_sha" \
                --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [ -n "$run_id" ]; then break; fi
              sleep 10
            done
            if [ -z "$run_id" ]; then
              echo "no $workflow pull_request run appeared for $head_sha; its required context cannot report" >&2
              exit 1
            fi
            if parked "$run_id"; then
              gh api --silent -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
              # Approval resumes the same run; wait for it to leave the parked
              # state so `gh run watch` reads the real verdict, not the stub.
              for _ in $(seq 1 30); do
                if ! parked "$run_id"; then break; fi
                sleep 10
              done
            fi
            run_ids+=("$run_id")
          done
          for run_id in "${run_ids[@]}"; do
            gh run watch "$run_id" --exit-status
          done
          gh pr merge "$branch" --squash --delete-branch --auto
          gh workflow run nix.yml --ref main

  # A bump that cannot land must not wait unseen: #630 sat blocked for three
  # weeks while every reported check was green. Once the pin PR has been open
  # for a day, keep one issue naming what it waits on, rewritten on every
  # refresh, and close it when no pin PR has been waiting that long.
  report-stalled:
    needs: update
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    steps:
      - name: Open, update or close the stalled-bump issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Pin refresh PR is not landing"
          issue="$(gh api "repos/$GH_REPO/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq "map(select(.pull_request == null and .title == \"$title\"))[0].number // empty")"
          pr="$(gh pr list --head bot/update-pins --state open --limit 1 \
            --json url,createdAt,headRefOid,mergeStateStatus,autoMergeRequest,statusCheckRollup \
            --jq '.[0] // empty')"
          if [ -z "$pr" ] ||
            [ $(($(date +%s) - $(date -d "$(jq -r .createdAt <<<"$pr")" +%s))) -lt 86400 ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "No pin refresh PR has been open for more than a day as of $RUN_URL."
            fi
            exit 0
          fi
          blockers="$RUNNER_TEMP/blockers"
          # Classic protection and rulesets can each require contexts.
          {
            gh api "repos/$GH_REPO/branches/main" --jq '.protection.required_status_checks.contexts[]?'
            gh api "repos/$GH_REPO/rules/branches/main" \
              --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context'
          } | sort -u | while IFS= read -r context; do
            jq -r --arg context "$context" '
              [.statusCheckRollup[] | select((.name // .context) == $context)
                | if (.conclusion // "") != "" then .conclusion else (.state // .status) end]
              | (first // "MISSING") as $state
              | select(["SUCCESS", "SKIPPED", "NEUTRAL"] | index($state) | not)
              | "- required check `\($context)` is `\($state)` on the head"' <<<"$pr"
          done >"$blockers"
          {
            gh run list --commit "$(jq -r .headRefOid <<<"$pr")" --status action_required \
              --json workflowName,url |
              jq -r '.[] | "- the \(.workflowName) run is parked in `action_required` until approved: \(.url)"'
            jq -r 'select(.mergeStateStatus == "DIRTY") | "- the branch conflicts with `main`"' <<<"$pr"
            jq -r 'select(.autoMergeRequest == null) | "- auto-merge is not enabled"' <<<"$pr"
          } >>"$blockers"
          if [ ! -s "$blockers" ]; then
            echo "- no missing, failing or parked required check was found" >"$blockers"
          fi
          body="$(jq -r --rawfile blockers "$blockers" --arg run "$RUN_URL" '
            "\(.url) has been open since \(.createdAt), at head `\(.headRefOid[:12])` with merge state `\(.mergeStateStatus)`.\n\n"
            + "Blockers:\n\n\($blockers)\n"
            + "Checked by \($run). This issue is rewritten on every pin refresh and closed once no pin refresh PR has been open for more than a day."' <<<"$pr")"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
