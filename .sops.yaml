# The audience of every secret in this repository (ADR 0008, docs/secrets.md).
#
# Two kinds of identity appear here and nowhere else. The operator is two
# recipients: `alex`, the daily identity held in the Mac's Secure Enclave and
# unlocked by Touch ID for every edit (`sops secrets/<file>.yaml`), and
# `alex-recovery`, the software key whose only copy is the break-glass note
# in Bitwarden, encrypted to on every file so a lost Mac costs nothing but
# `sops updatekeys` with it. Everything under `machines` is a machine's own
# activation key, generated on that machine by `atyrode identity init` and
# never copied anywhere; the ceremony prints the one line that belongs in
# this file. A machine is registered by filling its slot and re-encrypting
# the files it may read: `sops updatekeys`.
#
# Only public recipients live here. The repository is public, and this file
# is what a reader learns from it: which secrets exist and who may read them,
# never a value.
keys:
  # operator -- the daily slot stays commented out until the Mac has run
  # `atyrode operator init` and the recipient it printed is pasted here; the
  # recovery recipient is active from the first file.
  # - &alex age1se1...
  - &alex-recovery age1pjcf90jv97whw39dxtynv99rwgdj4u7nuy7m3a4fvhgfrsrgvsespknzgm
  # machines -- one slot per registered host, in registry order. A slot stays
  # commented out until that machine has run `atyrode identity init` and the
  # operator has pasted the recipient it printed.
  # - &alex-aarch64-darwin age1...
  # - &alex-aarch64-linux age1...
  # - &alex-x86_64-linux age1...
  # - &alex-x86_64-linux-desktop age1...
  # - &alex-x86_64-linux-wsl age1...

creation_rules:
  # Values every machine may read. Registering a machine adds it here and to
  # its own file below; nowhere else.
  - path_regex: ^secrets/shared\.yaml$
    key_groups:
      - age:
          # - *alex
          - *alex-recovery
          # - *alex-aarch64-darwin
          # - *alex-aarch64-linux
          # - *alex-x86_64-linux
          # - *alex-x86_64-linux-desktop
          # - *alex-x86_64-linux-wsl
  # Values for one machine: that machine and the operator, nobody else.
  - path_regex: ^secrets/alex-aarch64-darwin\.yaml$
    key_groups:
      - age:
          # - *alex
          - *alex-recovery
          # - *alex-aarch64-darwin
  - path_regex: ^secrets/alex-aarch64-linux\.yaml$
    key_groups:
      - age:
          # - *alex
          - *alex-recovery
          # - *alex-aarch64-linux
  - path_regex: ^secrets/alex-x86_64-linux\.yaml$
    key_groups:
      - age:
          # - *alex
          - *alex-recovery
          # - *alex-x86_64-linux
  - path_regex: ^secrets/alex-x86_64-linux-desktop\.yaml$
    key_groups:
      - age:
          # - *alex
          - *alex-recovery
          # - *alex-x86_64-linux-desktop
  - path_regex: ^secrets/alex-x86_64-linux-wsl\.yaml$
    key_groups:
      - age:
          # - *alex
          - *alex-recovery
          # - *alex-x86_64-linux-wsl
