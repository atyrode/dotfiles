# Pool R (OpenRouter) notes: the three entries above are one model — the same
# id declared once per tier with ascending thinking ceilings, which is how a
# single-model family rides the ladder (the generator refuses anything less
# than a full tiers-1..3 run). Free while OpenRouter's promotional window
# lasts; when it ends, delete these three blocks and re-render — the ox lanes
# vanish from the generator on their own. `code generate init --refresh`
# would drop them (it rewrites the file wholesale and skips $0 models), so
# keep them curated here and let refresh-model-facts update their facts in
# place (POOL_PROVIDER knows "R").
