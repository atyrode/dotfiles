symbolPreset: unicode
colorBlindMode: true

modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  advisor: anthropic/claude-haiku-4-5:low
  smol: openai-codex/gpt-5.6-luna:low
  task: openai-codex/gpt-5.6-terra:medium
  sonic: openai-codex/gpt-5.6-luna:minimal
  librarian: openai-codex/gpt-5.6-terra:medium
  designer: anthropic/claude-sonnet-5:medium
  reviewer: anthropic/claude-sonnet-5:high
  plan: anthropic/claude-fable-5:high
  slow: anthropic/claude-opus-5:xhigh
  tiny: openai-codex/gpt-5.6-luna:low
  commit: openai-codex/gpt-5.6-luna:low
  # omp routes image description here when the active model is text-only
  # (today only the codex spark variants). Unset, it lands on `default`.
  vision: openai-codex/gpt-5.6-luna:low

retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  # Preserve a small emergency margin instead of discovering quota exhaustion
  # mid-turn. Reliable coding-plan reports only; ordinary API keys are ignored.
  usageAwareFallback: true
  usageReservePct: 5
  usageReservePolicy: confirm
  # Redundancy first: a same-provider sibling backs each lead before the cross,
  # so a single-model outage never leaves its bucket; then the matched pair on
  # the other provider. Chains never route below the lead's tier. Spark (drain)
  # and Fable (elite) draw separate quota and never appear as a net — plan leads
  # on Fable deliberately and falls back to main-plan Opus. Trivial leads carry
  # no chain: a blip on commit/tiny/sonic is harmless.
  # Keys are omp role ids or provider/model selectors — never agent names.
  # `reviewer`/`librarian` were agent names: both matched nothing and never
  # fired, silently, since unknown role names raise no warning. Those agents
  # take their model from task.agentModelOverrides and inherit `default`.
  # `designer`/`task` work only because each is both an agent and a role.
  # Check omp's current role list before adding a key; it grows (`vision` is
  # recent). Deliberately not duplicated here — a copy would go stale.
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-terra:medium
      - anthropic/claude-opus-5:medium
      - anthropic/claude-sonnet-5:medium
    task:
      - openai-codex/gpt-5.6-sol:medium
      - anthropic/claude-sonnet-5:medium
      - anthropic/claude-opus-5:medium
    plan:
      - anthropic/claude-opus-5:high
      - openai-codex/gpt-5.6-sol:high
      - openai-codex/gpt-5.6-terra:high
    slow:
      - anthropic/claude-sonnet-5:xhigh
      - openai-codex/gpt-5.6-sol:xhigh
      - openai-codex/gpt-5.6-terra:xhigh
    designer:
      - anthropic/claude-opus-5:medium
      - openai-codex/gpt-5.6-terra:medium
      - openai-codex/gpt-5.6-sol:medium

personality: pragmatic

advisor:
  enabled: true
  syncBacklog: "1"

stt:
  enabled: true

branchSummary:
  enabled: true

# GPT-5.6's 1M window bills the whole request at 2x input / 1.5x output
# after 272K input. Compact at the standard-price boundary by default; use
# /extended-context for the exceptional session that benefits from the premium tier.
extendedContext: false

# Prepare compaction before the standard-price boundary so the handoff is
# immediate when needed; unlike idle recaps, this serves required maintenance.
compaction:
  asyncEnabled: true

# Idle recaps spend a background model call for transient convenience. Branch
# summaries and explicit compaction already preserve the useful state.
recap:
  enabled: false

# Off with the memory backend (#258): the Auto-Learn prompt section and
# capture nudges are the same class of context pollution (operator decision
# 2026-07-17). Existing managed skills stay on disk under
# ~/.omp/agent/managed-skills.
autolearn:
  enabled: false
  autoContinue: false

github:
  enabled: true

checkpoint:
  enabled: true

# v17 made both settings opt-in. This repository deliberately keeps structural
# search available and trades occasional extra reads for unseen-line edit safety.
astGrep:
  enabled: true
edit:
  enforceSeenLines: true

statusLine:
  preset: default
  compactThinkingLevel: false
  transparent: false

terminal:
  showProgress: true

tui:
  tight: false

display:
  shimmer: classic
  showTokenUsage: false
  cacheMissMarker: false

codexResets:
  autoRedeem: "no"

task:
  showResolvedModelBadge: true
  agentModelOverrides:
    designer: anthropic/claude-sonnet-5:medium
    librarian: openai-codex/gpt-5.6-terra:medium
    reviewer: anthropic/claude-sonnet-5:high
    scout: openai-codex/gpt-5.6-luna:medium
    sonic: openai-codex/gpt-5.6-luna:minimal
    task: openai-codex/gpt-5.6-terra:medium
  disabledAgents: []

# Memory guidance in the system prompt pollutes agent context for no
# proportionate recall value; keep the backend off across managed launches
# (operator decision 2026-07-17). Re-enable per machine via
# ~/.config/omp/local.yml if a profile ever needs it.
memory:
  backend: off

theme:
  dark: titanium

browser:
  headless: true
  enabled: true

proseOnlyThinking: false
defaultThinkingLevel: medium
