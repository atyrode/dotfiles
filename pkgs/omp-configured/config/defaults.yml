symbolPreset: unicode
colorBlindMode: true

modelRoles:
  default: anthropic/claude-sonnet-5-5:medium
  advisor: anthropic/claude-haiku-5-5:low
  smol: anthropic/claude-haiku-5-5:medium
  task: anthropic/claude-sonnet-5-5:medium
  plan: anthropic/claude-sonnet-5-5:high
  slow: anthropic/claude-sonnet-5-5:high
  tiny: anthropic/claude-haiku-5-5:low
  commit: anthropic/claude-haiku-5-5:low
  widget: anthropic/claude-haiku-5-5:low
  # omp routes image description here when the active model is text-only
  # (of the catalog's models, today only deepseek-v4-pro). Unset, it lands
  # on `default`.
  vision: openai-codex/gpt-6-luna:low

retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  # Preserve a small emergency margin instead of discovering quota exhaustion
  # mid-turn. Reliable coding-plan reports only; ordinary API keys are ignored.
  usageAwareFallback: true
  usageReservePct: 5
  usageReservePolicy: confirm
  # Native agents select shared roles; retain that identity for retries.
  # Routine fallbacks do not promote to premium models or higher effort.
  # Explicit empty utility chains prevent inheriting the default chain.
  fallbackChains:
    tiny: []
    commit: []
    vision: []
    widget: []
    advisor:
      - openai-codex/gpt-6-luna:low
    smol:
      - openai-codex/gpt-6-luna:medium
    default:
      - openai-codex/gpt-6.1-sol:medium
      - openai-codex/gpt-6.1-terra:medium
    task:
      - openai-codex/gpt-6.1-sol:medium
      - openai-codex/gpt-6.1-terra:medium
    plan:
      - openai-codex/gpt-6.1-sol:high
      - openai-codex/gpt-6.1-terra:high
    slow:
      - openai-codex/gpt-6.1-sol:high
      - openai-codex/gpt-6.1-terra:high

personality: pragmatic

advisor:
  enabled: true
  syncBacklog: "1"

stt:
  enabled: true

branchSummary:
  enabled: true

# Long-context tiers bill a premium past the standard window: Haiku 5.5 bills
# 5x input and output beyond 100K input, and OMP caps its window at 100K while
# this is off. Compact at the standard-price boundary by default; use
# /extended-context for the exceptional session that benefits from the premium tier.
extendedContext: false

# Prepare compaction before the standard-price boundary so the handoff is
# immediate when needed; unlike idle recaps, this serves required maintenance.
compaction:
  asyncEnabled: true

# Idle recaps spend a background model call for transient convenience. Branch
# summaries and explicit compaction already preserve the useful state.
recap:
  enabled: false

# Off with the memory backend (#258): the Auto-Learn prompt section and
# capture nudges are the same class of context pollution (operator decision
# 2026-07-17). Existing managed skills stay on disk under
# ~/.omp/agent/managed-skills.
autolearn:
  enabled: false
  autoContinue: false

github:
  enabled: true

checkpoint:
  enabled: true

# v17 made both settings opt-in. This repository deliberately keeps structural
# search available and trades occasional extra reads for unseen-line edit safety.
astGrep:
  enabled: true
edit:
  enforceSeenLines: true

statusLine:
  preset: default
  compactThinkingLevel: false
  transparent: false

terminal:
  showProgress: true

tui:
  tight: false

display:
  shimmer: classic
  showTokenUsage: false
  cacheMissMarker: false

codexResets:
  autoRedeem5h: "no"
  autoRedeemWeekly: "no"

task:
  showResolvedModelBadge: true
  disabledAgents: []

# Memory guidance in the system prompt pollutes agent context for no
# proportionate recall value; keep the backend off across managed launches
# (operator decision 2026-07-17). Re-enable per machine via
# ~/.config/omp/local.yml if a profile ever needs it.
memory:
  backend: off

theme:
  dark: titanium

browser:
  headless: true
  enabled: true

proseOnlyThinking: false
defaultThinkingLevel: medium

# Nix owns the version; repository pin-update automation reports new releases.
startup:
  checkUpdate: false
