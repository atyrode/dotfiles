# Model catalog for the routing tooling: the curated fields (short key, pool,
# tier, quota bucket, role note) plus a cache of the factual fields omp measures.
#
# The factual fields are NOT hand-maintained — omp is the authority for all of
# them, and `code generate init --refresh` re-derives them from the pinned omp:
#   cost_in / cost_out ($ per 1M tokens), context, thinking  <- `omp models --json`
#   image (text-only marker)                                 <- `omp models --json`
#   speed (output tok/s), ttft (time-to-first-token, seconds) <- `omp bench`
# They live here only because the Nix build sandbox has no network, creds, or
# ~/.omp and so cannot reach omp itself; this file is that committed cache. Do not
# edit the factual fields by hand — re-run the refresh instead. (speed/ttft are a
# live benchmark, so they drift with load; re-run when you want fresh figures.)
#
# `context` is the largest window omp grants the model: `omp models --json` run
# with an `extendedContext: true` overlay (`--config`). Managed and seeded configs
# keep extended context off, where omp reports each standard window instead
# (Haiku 5.5 100K, GPT-6 272K, GPT-6.1 500K). `code generate` reads context only
# to reject a rung that offers less than a cheaper rung below it.
#
#   pool:   O = openai-codex   ·   A = anthropic   ·   D = deepseek (optional)
#   tier:   1 speed · 2 regular · 3 smart · 4 elite
#           Tiers 1..3 form the per-pool fallback ladder; 4 is the top rung the
#           model dial's `elite` notch leads with. Tier 0 is the generator's
#           idle-bucket drain lead (the spark dial); no callable model fills it,
#           so `code generate` renders no `_sp` combos and Code hides the dial.
#   image:  false marks a text-only model, which the vision role then avoids.
#   bucket: the quota window a model draws (a separate rate bucket per provider).
#
# Consumed by `code generate` to render the facet grid the `code` generator
# browses (cost/model catalog + routing).
# Date of the last complete metadata AND chat benchmark refresh for every model.
# null means no complete refresh of the current set of model ids is attested.
# 2026-11-10 (omp 18.18.1): Fable 5.2 metadata from `omp models --json`;
# speed/ttft from `omp bench anthropic/claude-fable-5-2 --profile chat
# --runs 3 --par 1 --max-tokens 384 --json` (all three requests succeeded).
# Other model facts retain their existing snapshots.
refreshed: null
# probed: `code generate` refuses a catalog that is not marked verified, because
# omp lists models an account cannot actually call and nothing in their metadata
# says so. This file is a curated committed cache rather than a live scaffold, so
# the mark is an operator attestation: every id below is one that these accounts
# call. It describes the ids as written — change or add an `id` and re-confirm it
# (`code generate init --refresh` probes for you) rather than leaving this true.
probed: true
