# Model catalog for routing: authored short keys, pools, tiers, quota buckets
# and role notes alongside cached OMP metadata and prior measurements.
#
# OMP is the factual authority; do not hand-edit cached facts. Refresh existing
# exact IDs without probes or ladder changes using:
#   code generate refresh --metadata-only --models-file FILE --from-json JSON
# The JSON must be an authoritative `omp models --json` snapshot/projection.
#   cost_in / cost_out: base API estimates, $ per 1M input/output tokens.
#   context / thinking / image: listed capabilities, not account entitlement.
# API estimates are NOT OAuth subscription bills. Cache pricing and long-context
# premiums are not represented by these two base-price fields.
#
# Metadata-only refresh preserves speed/ttft, authored policy and the existing
# probed identity attestation. Prior output-token rates and TTFT (first-token
# latency, seconds) retain their measurement provenance. Provider-reported
# output/full-request rates are not visible-answer throughput or intelligence;
# none was remeasured here, and historical snapshots drift with provider load.
#
# `context` records the scoped contextWindow in the captured standard-window
# metadata, not an inferred extended maximum. Managed and seeded configs keep
# extended context off: Haiku 5.5 100K, Luna/Astra 6 272K, Terra/Sol 6.1 500K.
# Model tiers are authored policy; a higher tier need not have a larger window.
#
#   pool:   O = openai-codex   ·   A = anthropic   ·   D = deepseek (optional)
#   tier:   1 speed · 2 regular · 3 smart · 4 elite
#           Tiers 1..3 form the per-pool fallback ladder; 4 is the top rung the
#           model dial's `elite` notch leads with. Tier 0 is the generator's
#           idle-bucket drain lead (the spark dial); no callable model fills it,
#           so `code generate` renders no `_sp` combos and Code hides the dial.
#   image:  false marks a text-only model, which the vision role then avoids.
#   bucket: the quota window a model draws (a separate rate bucket per provider).
#
# Consumed by `code generate` to render the facet grid the `code` generator
# browses (cost/model catalog + routing).
# Date of the last complete metadata AND chat benchmark refresh for every model.
# null means no complete refresh of the current set of model IDs is attested.
# 2026-11-14 (OMP 18.20.0): metadata-only scope is the eight latest A/O models:
# Haiku 5.5, Sonnet 5.5, Opus 5.5, Fable 5.2, Luna 6, Terra 6.1, Sol 6.1,
# Astra 6. Authority: exact captured live rows from the supported managed Code
# launch `models --json`, 2026-11-14; standard-window scoped, with no inferred
# extendedContextWindow. Refresh only from that authoritative projection.
# Optional D models absent from it retain prior facts and are reported unmatched;
# no model calls, benchmark refresh or entitlement probes are implied.
# Fable's prior 2026-11-10 (OMP 18.18.1) three-run benchmark is unchanged:
# `omp bench anthropic/claude-fable-5-2 --profile chat --runs 3 --par 1
# --max-tokens 384 --json` (all three requests succeeded). No latency or speed
# was remeasured here; refreshed remains null rather than claiming full refresh.
refreshed: null
# probed: `code generate` refuses a catalog that is not marked verified, because
# omp lists models an account cannot actually call and nothing in their metadata
# says so. This file is a curated committed cache rather than a live scaffold, so
# the mark is an operator attestation: every id below is one that these accounts
# call. It describes the ids as written — change or add an `id` and re-confirm it
# (`code generate init --refresh` probes for you) rather than leaving this true.
probed: true
